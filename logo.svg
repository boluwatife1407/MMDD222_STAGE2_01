<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="240" height="144">
  <!-- Outer Red Ring -->
  <ellipse cx="200" cy="120" rx="190" ry="110" fill="#D94436" />
  
  <!-- Middle White Border Ring -->
  <ellipse cx="200" cy="120" rx="180" ry="102" fill="#FFFFFF" />
  
  <!-- Inner Navy Blue Oval -->
  <ellipse cx="200" cy="120" rx="172" ry="95" fill="#2D4B73" />
  
  <!-- Top Text: SINCE 1956 -->
  <text x="200" y="52" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SINCE 1956</text>
  
  <!-- Jersey Mike's Styled Main Title -->
  <g font-family="'Impact', 'Arial Black', sans-serif" text-anchor="middle">
    <!-- Outer white stroke glow/shadow for Jersey -->
    <text x="200" y="105" font-size="52" fill="#D94436" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" font-style="italic">Jersey</text>
    <text x="200" y="105" font-size="52" fill="#D94436" font-style="italic">Jersey</text>
    
    <!-- Outer white stroke glow/shadow for Mike's -->
    <text x="200" y="158" font-size="56" fill="#D94436" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" font-style="italic">Mike's</text>
    <text x="200" y="158" font-size="56" fill="#D94436" font-style="italic">Mike's</text>
  </g>
  
  <!-- Registered Trademark symbol -->
  <text x="322" y="140" font-family="sans-serif" font-size="10" fill="#FFFFFF">®</text>
  
  <!-- Bottom Text: SUBS -->
  <text x="200" y="202" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">SUBS</text>
</svg>
